name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --dir backend exec prisma generate

      - name: Lint frontend
        run: pnpm --dir frontend run --if-present lint

      - name: Lint backend
        run: pnpm --dir backend run --if-present lint

      - name: Test frontend
        run: pnpm --dir frontend run --if-present test

      - name: Test backend
        run: pnpm --dir backend run --if-present test

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.5
    with:
      upload-sarif: false
      scan-args: |-
        --lockfile=./frontend/pnpm-lock.yaml
        --lockfile=./backend/pnpm-lock.yaml

